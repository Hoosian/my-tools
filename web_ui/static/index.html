<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6fa;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: #2c3e50;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      background: #fff;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: #666;
      font-size: 15px;
    }
    .tab.active {
      background: #4a90d9;
      color: #fff;
      box-shadow: 0 2px 6px rgba(74,144,217,0.3);
    }
    .panel {
      display: none;
      background: #fff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .panel.active { display: block; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #555;
    }
    input[type="text"],
    input[type="number"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4a90d9;
    }
    input[type="file"] { padding: 8px; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .checkbox-group {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-top: 6px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary {
      background: #4a90d9;
      color: #fff;
    }
    .btn-primary:hover { background: #3a7bc8; }
    .btn-primary:disabled {
      background: #a0c4e8;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .result.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .result.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
    .result a {
      color: #1565c0;
      text-decoration: none;
      font-weight: 500;
    }
    .result a:hover { text-decoration: underline; }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .schema-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .schema-row input, .schema-row select {
      margin-bottom: 0;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-add {
      background: #e3f2fd;
      color: #1565c0;
    }
    .btn-remove {
      background: #ffebee;
      color: #c62828;
    }
    .preview-area {
      display: none;
      margin-top: 12px;
    }
    .preview-area img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .preview-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    .compare-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 12px;
    }
    .compare-col {
      text-align: center;
    }
    .compare-col img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #f0f4f8;
      padding: 4px;
      border-radius: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      color: #666;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #4a90d9;
      color: #fff;
    }
    .file-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      background: #fafafa;
    }
    .batch-summary {
      margin-top: 12px;
    }
    .batch-summary .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }
    .batch-summary .ok { color: #2e7d32; }
    .batch-summary .err { color: #c62828; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: #555;
    }
    .file-item:nth-child(odd) { background: #f0f4f8; }
    .file-item .thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      cursor: zoom-in;
      flex-shrink: 0;
    }
    .file-item .info {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-item .remove {
      color: #c62828;
      cursor: pointer;
      font-size: 12px;
      border: none;
      background: none;
      flex-shrink: 0;
    }
    .result-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      cursor: zoom-in;
      flex-shrink: 0;
      border: 1px solid #ddd;
    }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    .preview-modal.active { display: flex; }
    .preview-modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .preview-modal .close-btn {
      position: absolute;
      top: 16px;
      right: 24px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Tools</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('image')">🖼️ 图片转换</button>
      <button class="tab" onclick="switchTab('excel')">📊 Excel 生成</button>
      <button class="tab" onclick="switchTab('doc')">📝 文档处理</button>
    </div>

    <!-- 图片转换 -->
    <div id="panel-image" class="panel active">
      <form id="imageForm" onsubmit="handleImageSubmit(event)">
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" id="modeSingle" onclick="switchMode('single')">单张模式</button>
          <button type="button" class="mode-btn" id="modeBatch" onclick="switchMode('batch')">批量模式</button>
        </div>
        <div class="form-group">
          <label id="fileLabel">选择图片</label>
          <input type="file" id="imgFile" accept="image/*" required>
          <div id="fileList" class="file-list" style="display:none"></div>
          <div id="originalPreview" class="preview-area">
            <div class="preview-label">原始图片</div>
            <img id="originalImg" src="" alt="原始预览">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>目标格式</label>
            <select id="imgFormat" required>
              <option value="jpg">JPG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP</option>
              <option value="avif">AVIF</option>
              <option value="tiff">TIFF</option>
              <option value="gif">GIF</option>
            </select>
          </div>
          <div class="form-group">
            <label>质量 (1-100)</label>
            <input type="number" id="imgQuality" value="85" min="1" max="100">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>裁剪比例 <span class="hint">可选，如 3:4, 16:9</span></label>
            <input type="text" id="imgRatio" placeholder="留空则不裁剪">
          </div>
          <div class="form-group">
            <label>缩放尺寸 <span class="hint">可选，如 800x600</span></label>
            <input type="text" id="imgSize" placeholder="留空则不缩放">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>旋转角度 <span class="hint">可选，如 90, -45, 180</span></label>
            <input type="text" id="imgRotate" placeholder="留空则不旋转">
          </div>
          <div class="form-group">
            <label>翻转</label>
            <div class="checkbox-group">
              <label><input type="checkbox" id="imgFlipH"> 水平</label>
              <label><input type="checkbox" id="imgFlipV"> 垂直</label>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>水印</label>
          <select id="watermarkType" onchange="toggleWatermarkFields()">
            <option value="none">无</option>
            <option value="text">文字水印</option>
            <option value="image">图片水印</option>
          </select>
        </div>
        <div id="wmTextSection" class="watermark-section" style="display:none">
          <div class="row">
            <div class="form-group">
              <label>水印文字</label>
              <input type="text" id="watermarkText" placeholder="输入水印文字">
            </div>
            <div class="form-group">
              <label>颜色 <span class="hint">如 rgba(255,255,255,0.5)</span></label>
              <input type="text" id="watermarkColor" value="rgba(255,255,255,0.5)">
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label>位置</label>
              <select id="watermarkTextPosition">
                <option value="top-left">左上</option>
                <option value="top">上中</option>
                <option value="top-right">右上</option>
                <option value="left">左中</option>
                <option value="center">居中</option>
                <option value="right">右中</option>
                <option value="bottom-left">左下</option>
                <option value="bottom">下中</option>
                <option value="bottom-right" selected>右下</option>
              </select>
            </div>
            <div class="form-group">
              <label>处理方式 <span class="hint">文字太长时</span></label>
              <select id="watermarkFit">
                <option value="shrink" selected>自动换行（多行显示）</option>
                <option value="truncate">截断显示（加省略号）</option>
              </select>
            </div>
          </div>
        </div>
        <div id="wmImageSection" class="watermark-section" style="display:none">
          <div class="form-group">
            <label>水印图片</label>
            <input type="file" id="watermarkImage" accept="image/*">
          </div>
          <div class="row">
            <div class="form-group">
              <label>位置</label>
              <select id="watermarkPosition">
                <option value="top-left">左上</option>
                <option value="top">上中</option>
                <option value="top-right">右上</option>
                <option value="left">左中</option>
                <option value="center">居中</option>
                <option value="right">右中</option>
                <option value="bottom-left">左下</option>
                <option value="bottom">下中</option>
                <option value="bottom-right" selected>右下</option>
              </select>
            </div>
            <div class="form-group">
              <label>缩放比例 <span class="hint">0.0 - 1.0</span></label>
              <input type="number" id="watermarkScale" value="0.2" min="0" max="1" step="0.05">
            </div>
          </div>
          <div class="form-group">
            <label>透明度 <span class="hint">0.0 - 1.0</span></label>
            <input type="number" id="watermarkOpacity" value="0.5" min="0" max="1" step="0.05">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="imgBtn">开始转换</button>
        <div class="hint" id="batchHint" style="display:none;margin-top:6px;">将使用相同参数处理所有图片</div>
      </form>
      <div id="imgResult" class="result"></div>
    </div>

    <!-- Excel 生成 -->
    <div id="panel-excel" class="panel">
      <form id="excelForm" onsubmit="handleExcelGenerate(event)">
        <div class="row">
          <div class="form-group">
            <label>文件名</label>
            <input type="text" id="excelFilename" value="test.xlsx" required>
          </div>
          <div class="form-group">
            <label>数据行数</label>
            <input type="number" id="excelCount" value="10" min="1" max="10000" required>
          </div>
        </div>
        <div class="form-group">
          <label>表头与数据类型</label>
          <div id="schemaContainer"></div>
          <button type="button" class="btn-small btn-add" onclick="addSchemaRow()">+ 添加列</button>
        </div>
        <button type="submit" class="btn btn-primary" id="excelBtn">生成 Excel</button>
      </form>
      <div id="excelResult" class="result"></div>
    </div>

    <!-- 文档处理 -->
    <div id="panel-doc" class="panel">
      <form id="docForm" onsubmit="handleDocSubmit(event)">
        <div class="mode-toggle">
          <button type="button" class="mode-btn active" id="docModeStrike" onclick="switchDocMode('strike')">清理删除线</button>
          <button type="button" class="mode-btn" id="docModeMd" onclick="switchDocMode('md')">转 Markdown</button>
        </div>
        <div class="form-group">
          <label>选择 Word 文档</label>
          <input type="file" id="docFile" accept=".docx,.doc" required>
        </div>
        <button type="submit" class="btn btn-primary" id="docBtn">清理删除线</button>
      </form>
      <div id="docResult" class="result"></div>
    </div>
  </div>

  <div id="previewModal" class="preview-modal">
    <span class="close-btn">&times;</span>
    <img src="" alt="预览">
  </div>

  <script>
    const DATA_TYPES = [
      { value: 'name', label: '姓名' },
      { value: 'age', label: '年龄' },
      { value: 'email', label: '邮箱' },
      { value: 'phone', label: '电话' },
      { value: 'city', label: '城市' },
      { value: 'address', label: '地址' },
      { value: 'date', label: '日期' },
      { value: 'company', label: '公司' },
      { value: 'job', label: '职业' },
    ];

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('panel-' + name).classList.add('active');
    }

    function showResult(elId, msg, isError) {
      const el = document.getElementById(elId);
      el.innerHTML = msg;
      el.className = 'result ' + (isError ? 'error' : 'success');
      el.style.display = 'block';
    }

    function hideResult(elId) {
      const el = document.getElementById(elId);
      el.style.display = 'none';
    }

    // Excel schema 动态列
    function addSchemaRow(header = '', type = 'name') {
      const container = document.getElementById('schemaContainer');
      const row = document.createElement('div');
      row.className = 'schema-row';
      row.innerHTML = `
        <input type="text" placeholder="列名" value="${header}" class="schema-header" required>
        <select class="schema-type">${DATA_TYPES.map(t => `<option value="${t.value}" ${t.value === type ? 'selected' : ''}>${t.label}</option>`).join('')}</select>
        <button type="button" class="btn-small btn-remove" onclick="this.parentElement.remove()">删除</button>
      `;
      container.appendChild(row);
    }

    // 初始化默认列
    addSchemaRow('姓名', 'name');
    addSchemaRow('年龄', 'age');
    addSchemaRow('邮箱', 'email');
    addSchemaRow('电话', 'phone');
    addSchemaRow('城市', 'city');

    let originalImageData = '';

    function toggleWatermarkFields() {
      const type = document.getElementById('watermarkType').value;
      document.getElementById('wmTextSection').style.display = type === 'text' ? 'block' : 'none';
      document.getElementById('wmImageSection').style.display = type === 'image' ? 'block' : 'none';
    }

    async function handleImageConvert(e) {
      e.preventDefault();
      hideResult('imgResult');
      const btn = document.getElementById('imgBtn');
      btn.disabled = true;
      btn.textContent = '转换中...';

      const form = new FormData();
      form.append('file', document.getElementById('imgFile').files[0]);
      form.append('format', document.getElementById('imgFormat').value);
      form.append('quality', document.getElementById('imgQuality').value);
      form.append('ratio', document.getElementById('imgRatio').value);
      form.append('size', document.getElementById('imgSize').value);
      form.append('flipH', document.getElementById('imgFlipH').checked);
      form.append('flipV', document.getElementById('imgFlipV').checked);
      form.append('rotate', document.getElementById('imgRotate').value);

      const wmType = document.getElementById('watermarkType').value;
      form.append('watermarkType', wmType);
      if (wmType === 'text') {
        form.append('watermarkText', document.getElementById('watermarkText').value);
        form.append('watermarkColor', document.getElementById('watermarkColor').value);
        form.append('watermarkPosition', document.getElementById('watermarkTextPosition').value);
        form.append('watermarkFit', document.getElementById('watermarkFit').value);
      } else if (wmType === 'image') {
        const wmFile = document.getElementById('watermarkImage').files[0];
        if (wmFile) form.append('watermarkImage', wmFile);
        form.append('watermarkPosition', document.getElementById('watermarkPosition').value);
        form.append('watermarkScale', document.getElementById('watermarkScale').value);
        form.append('watermarkOpacity', document.getElementById('watermarkOpacity').value);
      }

      try {
        const res = await fetch('/api/image/convert', { method: 'POST', body: form });
        const data = await res.json();
        if (res.ok && data.success) {
          let html = `✅ 转换成功！<a href="${data.downloadUrl}" download>下载 ${data.filename}</a>`;
          if (originalImageData) {
            html += `<div class="compare-row"><div class="compare-col"><div class="preview-label">原始图片</div><img src="${originalImageData}"></div><div class="compare-col"><div class="preview-label">转换后</div><img src="${data.previewUrl}"></div></div>`;
          } else {
            html += `<br><img src="${data.previewUrl}" style="max-width:100%;margin-top:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">`;
          }
          showResult('imgResult', html, false);
        } else {
          showResult('imgResult', '❌ 失败：' + (data.detail || data.error || 'Unknown error'), true);
        }
      } catch (err) {
        showResult('imgResult', '❌ 请求失败：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '开始转换';
      }
    }

    // ========== 批量模式相关 ==========
    let currentMode = 'single';
    let batchFiles = [];

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('modeSingle').classList.toggle('active', mode === 'single');
      document.getElementById('modeBatch').classList.toggle('active', mode === 'batch');

      const fileInput = document.getElementById('imgFile');
      const fileList = document.getElementById('fileList');
      const previewArea = document.getElementById('originalPreview');
      const batchHint = document.getElementById('batchHint');
      const btn = document.getElementById('imgBtn');

      if (mode === 'batch') {
        fileInput.setAttribute('multiple', 'multiple');
        fileInput.removeAttribute('required');
        document.getElementById('fileLabel').textContent = '选择图片（可多选）';
        fileList.style.display = 'block';
        previewArea.style.display = 'none';
        batchHint.style.display = 'block';
        btn.textContent = '开始批量转换';
        fileInput.removeEventListener('change', handleSingleFileChange);
        fileInput.addEventListener('change', handleBatchFileChange);
      } else {
        fileInput.removeAttribute('multiple');
        fileInput.setAttribute('required', 'required');
        document.getElementById('fileLabel').textContent = '选择图片';
        fileList.style.display = 'none';
        batchHint.style.display = 'none';
        btn.textContent = '开始转换';
        batchFiles.forEach(f => { if (f._thumbUrl) URL.revokeObjectURL(f._thumbUrl); });
        batchFiles = [];
        renderFileList();
        fileInput.removeEventListener('change', handleBatchFileChange);
        fileInput.addEventListener('change', handleSingleFileChange);
      }
    }

    function handleSingleFileChange(e) {
      const file = e.target.files[0];
      const previewArea = document.getElementById('originalPreview');
      const previewImg = document.getElementById('originalImg');
      if (file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          originalImageData = ev.target.result;
          previewImg.src = originalImageData;
          previewArea.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        previewArea.style.display = 'none';
        previewImg.src = '';
        originalImageData = '';
      }
    }

    function handleBatchFileChange(e) {
      const newFiles = Array.from(e.target.files);
      newFiles.forEach(f => { f._thumbUrl = URL.createObjectURL(f); });
      batchFiles = batchFiles.concat(newFiles);
      renderFileList();
      e.target.value = '';
    }

    function renderFileList() {
      const container = document.getElementById('fileList');
      if (batchFiles.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = batchFiles.map((f, i) => `
        <div class="file-item">
          <img class="thumb" src="${f._thumbUrl || ''}" alt="" onclick="openPreviewModal('${f._thumbUrl || ''}')">
          <span class="info">${f.name} (${(f.size / 1024).toFixed(1)} KB)</span>
          <button type="button" class="remove" onclick="removeBatchFile(${i})">移除</button>
        </div>
      `).join('');
    }

    function removeBatchFile(index) {
      const f = batchFiles[index];
      if (f && f._thumbUrl) URL.revokeObjectURL(f._thumbUrl);
      batchFiles.splice(index, 1);
      renderFileList();
    }

    async function handleImageSubmit(e) {
      e.preventDefault();
      if (currentMode === 'batch') {
        await handleBatchConvert();
      } else {
        await handleImageConvert(e);
      }
    }

    async function handleBatchConvert() {
      hideResult('imgResult');
      if (batchFiles.length === 0) {
        showResult('imgResult', '❌ 请先选择至少一张图片', true);
        return;
      }

      const btn = document.getElementById('imgBtn');
      btn.disabled = true;
      btn.textContent = `转换中 (0/${batchFiles.length})...`;

      const form = new FormData();
      batchFiles.forEach(f => form.append('files', f));
      form.append('format', document.getElementById('imgFormat').value);
      form.append('quality', document.getElementById('imgQuality').value);
      form.append('ratio', document.getElementById('imgRatio').value);
      form.append('size', document.getElementById('imgSize').value);
      form.append('flipH', document.getElementById('imgFlipH').checked);
      form.append('flipV', document.getElementById('imgFlipV').checked);
      form.append('rotate', document.getElementById('imgRotate').value);

      const wmType = document.getElementById('watermarkType').value;
      form.append('watermarkType', wmType);
      if (wmType === 'text') {
        form.append('watermarkText', document.getElementById('watermarkText').value);
        form.append('watermarkColor', document.getElementById('watermarkColor').value);
        form.append('watermarkPosition', document.getElementById('watermarkTextPosition').value);
        form.append('watermarkFit', document.getElementById('watermarkFit').value);
      } else if (wmType === 'image') {
        const wmFile = document.getElementById('watermarkImage').files[0];
        if (wmFile) form.append('watermarkImage', wmFile);
        form.append('watermarkPosition', document.getElementById('watermarkPosition').value);
        form.append('watermarkScale', document.getElementById('watermarkScale').value);
        form.append('watermarkOpacity', document.getElementById('watermarkOpacity').value);
      }

      try {
        const res = await fetch('/api/image/batch', { method: 'POST', body: form });
        const data = await res.json();
        if (res.ok && data.success) {
          let html = `✅ 批量转换完成！共 ${data.total} 张，成功 ${data.succeeded} 张，失败 ${data.failed} 张。<br>`;
          html += `<a href="${data.zipUrl}" download>📦 下载 ZIP 压缩包</a>`;
          if (data.errors && data.errors.length > 0) {
            html += `<div class="batch-summary"><div class="preview-label" style="margin-top:12px;">失败详情：</div>`;
            data.errors.forEach(err => {
              html += `<div class="item err">❌ ${err.filename}：${err.error}</div>`;
            });
            html += `</div>`;
          }
          if (data.results && data.results.length > 0) {
            html += `<div class="batch-summary"><div class="preview-label" style="margin-top:12px;">成功文件（点击缩略图可放大）：</div>`;
            data.results.forEach(r => {
              html += `<div class="item ok"><img class="result-thumb" src="${r.previewUrl}" alt="" onclick="openPreviewModal('${r.previewUrl}')"> ✅ ${r.filename}</div>`;
            });
            html += `</div>`;
          }
          showResult('imgResult', html, false);
        } else {
          showResult('imgResult', '❌ 失败：' + (data.detail || data.error || 'Unknown error'), true);
        }
      } catch (err) {
        showResult('imgResult', '❌ 请求失败：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '开始批量转换';
      }
    }

    async function handleExcelGenerate(e) {
      e.preventDefault();
      hideResult('excelResult');
      const btn = document.getElementById('excelBtn');
      btn.disabled = true;
      btn.textContent = '生成中...';

      const headers = [];
      const schema = {};
      document.querySelectorAll('.schema-row').forEach(row => {
        const h = row.querySelector('.schema-header').value.trim();
        const t = row.querySelector('.schema-type').value;
        if (h) {
          headers.push(h);
          schema[h] = t;
        }
      });

      const body = {
        filename: document.getElementById('excelFilename').value,
        count: parseInt(document.getElementById('excelCount').value),
        headers,
        schema,
      };

      try {
        const res = await fetch('/api/excel/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showResult('excelResult', `✅ 生成成功！<a href="${data.downloadUrl}" download>下载 ${data.filename}</a>`, false);
        } else {
          showResult('excelResult', '❌ 失败：' + (data.detail || data.error || 'Unknown error'), true);
        }
      } catch (err) {
        showResult('excelResult', '❌ 请求失败：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '生成 Excel';
      }
    }

    let currentDocMode = 'strike';

    function switchDocMode(mode) {
      currentDocMode = mode;
      document.getElementById('docModeStrike').classList.toggle('active', mode === 'strike');
      document.getElementById('docModeMd').classList.toggle('active', mode === 'md');
      const btn = document.getElementById('docBtn');
      btn.textContent = mode === 'strike' ? '清理删除线' : '转 Markdown';
    }

    async function handleDocSubmit(e) {
      e.preventDefault();
      hideResult('docResult');
      const btn = document.getElementById('docBtn');
      btn.disabled = true;
      btn.textContent = currentDocMode === 'strike' ? '处理中...' : '转换中...';

      const form = new FormData();
      form.append('file', document.getElementById('docFile').files[0]);

      const endpoint = currentDocMode === 'strike'
        ? '/api/doc/remove-strikethrough'
        : '/api/doc/convert-to-markdown';

      try {
        const res = await fetch(endpoint, { method: 'POST', body: form });
        const data = await res.json();
        if (res.ok && data.success) {
          showResult('docResult', `✅ 处理成功！<a href="${data.downloadUrl}" download>下载 ${data.filename}</a>`, false);
        } else {
          showResult('docResult', '❌ 失败：' + (data.detail || data.error || 'Unknown error'), true);
        }
      } catch (err) {
        showResult('docResult', '❌ 请求失败：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = currentDocMode === 'strike' ? '清理删除线' : '转 Markdown';
      }
    }

    // 初始化模式
    switchMode('single');

    function openPreviewModal(src) {
      const modal = document.getElementById('previewModal');
      modal.querySelector('img').src = src;
      modal.classList.add('active');
    }

    function closePreviewModal() {
      document.getElementById('previewModal').classList.remove('active');
    }

    document.getElementById('previewModal').addEventListener('click', function(e) {
      if (e.target === this || e.target.closest('.close-btn')) {
        closePreviewModal();
      }
    });
  </script>

</body>
</html>
