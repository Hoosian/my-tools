[project]
name = "docx-to-markdown"
version = "0.1.0"
description = "Convert Word documents (.docx) to Markdown"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
]

[project.scripts]
docx-to-md = "docx_to_markdown.main:main"

[tool.hatch.build.targets.wheel]
packages = ["docx_to_markdown"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
